  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --purple: #9B30FF;
      --purple-light: #C070FF;
      --purple-dark: #6A0FD4;
      --blue: #1B2F7A;
      --blue-mid: #3B5BAD;
      --blue-light: #7B9FE0;
      --bg: #080810;
      --bg2: #0D0D1A;
      --surface: #111120;
      --surface2: #16162A;
      --border: rgba(155,48,255,0.13);
      --text: #F0EDF8;
      --muted: #9990BB;
      --sidebar-w: 290px;
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
      cursor: none;
    }

    /* ── CURSOR ── */
    .cursor { width: 9px; height: 9px; background: var(--purple); border-radius: 50%; position: fixed; top:0; left:0; pointer-events:none; z-index:9999; transform:translate(-50%,-50%); }
    .cursor-ring { width: 30px; height: 30px; border: 1.5px solid var(--purple-light); border-radius: 50%; position: fixed; top:0; left:0; pointer-events:none; z-index:9998; transform:translate(-50%,-50%); transition: all 0.16s ease; opacity:0.6; }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top:0; left:0; right:0; z-index:200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 50px;
      background: rgba(8,8,16,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .logo { font-family:'Syne',sans-serif; font-weight:800; font-size:1.2rem; display:flex; align-items:center; gap:8px; text-decoration:none; color:var(--text); }
    .logo-icon { width:28px; height:28px; background:linear-gradient(135deg,var(--purple-dark),var(--purple-light)); border-radius:7px; display:flex; align-items:center; justify-content:center; font-size:13px; }
    .logo span { color:var(--purple); }
    .nav-back { display:flex; align-items:center; gap:8px; color:var(--muted); text-decoration:none; font-size:0.88rem; transition:color 0.2s; }
    .nav-back:hover { color:var(--text); }
    .nav-back svg { width:16px; height:16px; }
    .nav-right { display:flex; align-items:center; gap:20px; }
    .nav-progress-label { font-size:0.78rem; color:var(--muted); }
    .nav-progress-bar { width:120px; height:4px; background:rgba(155,48,255,0.15); border-radius:4px; overflow:hidden; }
    .nav-progress-fill { height:100%; background:linear-gradient(90deg,var(--purple-dark),var(--purple-light)); border-radius:4px; transition:width 0.4s ease; width:0%; }

    /* ── LAYOUT ── */
    .layout {
      display: flex;
      padding-top: 61px;
      min-height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      position: fixed; top: 61px; left: 0; bottom: 0;
      overflow-y: auto; z-index: 100;
      padding: 28px 0 40px;
      scrollbar-width: thin;
      scrollbar-color: rgba(155,48,255,0.25) transparent;
    }
    .sidebar::-webkit-scrollbar { width: 4px; }
    .sidebar::-webkit-scrollbar-thumb { background: rgba(155,48,255,0.25); border-radius:4px; }

    .sidebar-header {
      padding: 0 22px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .sidebar-chapter {
      font-family: 'Syne', sans-serif;
      font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--blue-light); margin-bottom: 4px;
    }
    .sidebar-title {
      font-family: 'Syne', sans-serif;
      font-size: 1rem; font-weight: 700;
      color: var(--text);
    }

    /* Section group */
    .sidebar-group { margin-bottom: 4px; }
    .sidebar-section-btn {
      width: 100%; padding: 10px 22px;
      background: none; border: none;
      display: flex; align-items: center; justify-content: space-between;
      cursor: none; text-align: left;
      font-family: 'Syne', sans-serif;
      font-size: 0.82rem; font-weight: 700;
      color: var(--muted);
      transition: color 0.2s, background 0.2s;
      gap: 8px;
    }
    .sidebar-section-btn:hover { color: var(--text); background: rgba(155,48,255,0.06); }
    .sidebar-section-btn.active { color: var(--blue-light); }
    .sidebar-section-num {
      font-size: 0.7rem; color: var(--purple);
      font-family: 'DM Sans', sans-serif; font-weight: 500;
      flex-shrink: 0;
    }
    .sidebar-chevron { width:14px; height:14px; flex-shrink:0; transition:transform 0.25s ease; opacity:0.5; }
    .sidebar-section-btn.open .sidebar-chevron { transform: rotate(180deg); }

    /* Sub-items */
    .sidebar-items {
      max-height: 0; overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0.4,0,0.2,1);
    }
    .sidebar-items.open { max-height: 600px; }
    .sidebar-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 22px 7px 36px;
      text-decoration: none;
      font-size: 0.8rem; color: var(--muted);
      transition: color 0.2s, background 0.2s;
      border-left: 2px solid transparent;
      position: relative;
    }
    .sidebar-item:hover { color: var(--text); background: rgba(155,48,255,0.05); }
    .sidebar-item.active {
      color: var(--text);
      border-left-color: var(--blue-mid);
      background: rgba(59,91,173,0.08);
    }
    .sidebar-item-num { font-size: 0.68rem; color: var(--purple-dark); flex-shrink:0; }
    /* Completion dot */
    .sidebar-item::after {
      content: ''; position: absolute; right: 16px;
      width: 6px; height: 6px; border-radius: 50%;
      background: transparent; border: 1px solid rgba(155,48,255,0.25);
      transition: background 0.2s, border-color 0.2s;
    }
    .sidebar-item.done::after { background: var(--purple); border-color: var(--purple); }
    .sidebar-item.done {
    color: var(--text);
    background: rgba(155,48,255,0.08);
    border-left-color: var(--purple);
    }
    .sidebar-item.done .sidebar-item-num { color: var(--purple-light); }

    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      padding: 52px 64px 100px;
      max-width: 860px;
    }

    /* Hero banner */

      background: linear-gradient(135deg, #0F1A4A 0%, #1B2F7A 50%, #0a0a1a 100%);
      border: 1px solid rgba(59,91,173,0.35);
      border-radius: 18px;
      padding: 40px 44px;
      margin-bottom: 52px;
      position: relative; overflow: hidden;
    }
    .module-hero::before {
      content: ''; position: absolute;
      top: -60px; right: -60px;
      width: 260px; height: 260px;
      background: radial-gradient(circle, rgba(59,91,173,0.25) 0%, transparent 70%);
      border-radius: 50%;

    .module-hero-tag {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(59,91,173,0.25); border: 1px solid rgba(91,121,193,0.4);
      color: var(--blue-light); border-radius: 20px;
      padding: 4px 14px; font-size: 0.72rem; letter-spacing: 0.08em;
      text-transform: uppercase; margin-bottom: 16px;
    }
    .module-hero h1 {
      font-family: 'Syne', sans-serif;
      font-size: 2.2rem; font-weight: 800; margin-bottom: 10px;
    }
    .module-hero-sub { color: var(--muted); font-size: 0.95rem; line-height: 1.7; max-width: 480px; }
    .module-hero-meta {
      display: flex; gap: 24px; margin-top: 22px; flex-wrap: wrap;
    }
    .meta-item { display:flex; align-items:center; gap:6px; font-size:0.8rem; color:var(--muted); }
    .meta-item svg { width:14px; height:14px; opacity:0.6; }

    /* Section heading */
    .section-block { margin-bottom: 64px; scroll-margin-top: 90px; }
    .section-tag {
      display: inline-block;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--blue-light); margin-bottom: 8px;
    }
    .section-heading {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem; font-weight: 800;
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    /* Lesson card */
    .lesson-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: border-color 0.25s;
    }
    .lesson-card:hover { border-color: rgba(59,91,173,0.4); }

    .lesson-header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 22px; cursor: none;
      user-select: none;
    }
    .lesson-num {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem; font-weight: 700;
      color: var(--blue-light);
      background: rgba(59,91,173,0.15);
      border: 1px solid rgba(59,91,173,0.3);
      border-radius: 6px; padding: 3px 8px;
      flex-shrink: 0;
    }
    .lesson-title {
      font-family: 'Syne', sans-serif;
      font-size: 0.97rem; font-weight: 700;
      flex: 1;
    }
    .lesson-toggle {
      width: 28px; height: 28px; border-radius: 50%;
      background: rgba(155,48,255,0.1); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; transition: background 0.2s, transform 0.25s;
      cursor: none;
    }
    .lesson-card.open .lesson-toggle { background: var(--purple); transform: rotate(45deg); }
    .lesson-toggle svg { width:12px; height:12px; }

    .lesson-body {
      max-height: 0; overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.4,0,0.2,1);
      border-top: 0px solid var(--border);
    }
    .lesson-card.open .lesson-body {
      max-height: 900px;
      border-top-width: 1px;
    }
    .lesson-body-inner { padding: 22px 24px 26px; }

    /* Description area */
    .desc-area {
      background: var(--bg2);
      border: 1px dashed rgba(155,48,255,0.2);
      border-radius: 10px;
      padding: 16px 18px;
      margin-bottom: 20px;
      font-size: 0.88rem; color: var(--muted);
      line-height: 1.75;

    /* ✏️ EDIT MARKER — replace the placeholder text inside .desc-area with your own description */
    .desc-placeholder {
      display: flex; align-items: flex-start; gap: 10px;
      color: rgba(155,48,255,0.5);
      font-style: italic; font-size: 0.83rem;
    }
    .desc-placeholder span { font-style: normal; font-size: 1rem; }

    /* Resources area */
    .resources-area { display: flex; flex-direction: column; gap: 10px; }
    .resources-label {
      font-family: 'Syne', sans-serif;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase; color: var(--muted); margin-bottom: 4px;
    }

    /* Resource link row */
    .resource-link {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 16px;
      text-decoration: none; color: var(--text);
      transition: border-color 0.25s, background 0.25s;
      font-size: 0.87rem;
    }
    .resource-link:hover { border-color: rgba(155,48,255,0.4); background: rgba(155,48,255,0.06); }
    .resource-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem; flex-shrink: 0;
    }
    .resource-icon.yt  { background: rgba(255,0,0,0.15); }
    .resource-icon.web { background: rgba(59,91,173,0.2); }
    .resource-icon.doc { background: rgba(155,48,255,0.15); }
    .resource-info { flex:1; }
    .resource-name { font-weight: 500; font-size: 0.88rem; }

    .resource-sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
    .resource-arrow { color: var(--muted); font-size: 0.8rem; }

    .done-btn {
      margin-top: 18px;
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; border: 1px solid rgba(59,91,173,0.35);
      color: var(--blue-light); border-radius: 20px;
      padding: 7px 18px; font-family: 'DM Sans', sans-serif;
      font-size: 0.8rem; cursor: none;
      transition: all 0.25s;

    /* Responsive */
    @media (max-width: 900px) {
      .sidebar { display: none; }
      .main { margin-left: 0; padding: 36px 24px 80px; }

</head>

// ── Build sidebar
const sidebarNav = document.getElementById('sidebarNav');
chapters.forEach((ch, ci) => {
  const group = document.createElement('div');
  group.className = 'sidebar-group';
  group.innerHTML = `
    <button class="sidebar-section-btn" data-ci="${ci}">
      <span style="display:flex;align-items:center;gap:8px;flex:1">
        <span class="sidebar-section-num">${ch.num}</span>
        <span>${ch.title}</span>
      </span>
      <svg class="sidebar-chevron" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
    </button>
    <div class="sidebar-items" id="sidebarItems-${ci}">
      ${ch.lessons.map((l,li) => `
        <a href="#lesson-${ci}-${li}" class="sidebar-item" id="sidebarLink-${ci}-${li}">
          <span class="sidebar-item-num">${ch.num}.${l.num}</span>
          <span>${l.title}</span>
        </a>`).join('')}
    </div>
  `;
  sidebarNav.appendChild(group);
});

// Sidebar toggle
document.querySelectorAll('.sidebar-section-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const ci = btn.dataset.ci;
    const items = document.getElementById(`sidebarItems-${ci}`);
    const isOpen = items.classList.contains('open');
    // Close all
    document.querySelectorAll('.sidebar-items').forEach(el => el.classList.remove('open'));
    document.querySelectorAll('.sidebar-section-btn').forEach(el => el.classList.remove('open','active'));
    if (!isOpen) {
      items.classList.add('open');
      btn.classList.add('open','active');
    }
  });
});

  block.innerHTML = `

// ── Lesson card toggle
document.addEventListener('click', e => {
  const header = e.target.closest('.lesson-header');
  if (header) {
    const card = header.closest('.lesson-card');
    card.classList.toggle('open');
    // Highlight sidebar item
    const ci = header.dataset.ci, li = header.dataset.li;
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    const sLink = document.getElementById(`sidebarLink-${ci}-${li}`);
    if (sLink) sLink.classList.add('active');
    // Auto-open sidebar section
    const items = document.getElementById(`sidebarItems-${ci}`);
    const btn = document.querySelector(`.sidebar-section-btn[data-ci="${ci}"]`);
    if (items && !items.classList.contains('open')) {
      items.classList.add('open'); btn && btn.classList.add('open','active');
    }
  }
});

// ── Mark as done
let doneCount = 0;
const totalLessons = chapters.reduce((sum, ch) => sum + ch.lessons.length, 0);
document.addEventListener('click', e => {
  const btn = e.target.closest('.done-btn');
  if (btn) {
    const ci = btn.dataset.ci, li = btn.dataset.li;
    const isDone = btn.classList.toggle('marked');
    btn.textContent = isDone ? '✓ Done!' : 'Mark as done';
    if (isDone) { btn.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Done!'; }
    else { btn.innerHTML = '<svg fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg> Mark as done'; }
    // Sidebar dot
    const sLink = document.getElementById(`sidebarLink-${ci}-${li}`);
    if (sLink) sLink.classList.toggle('done', isDone);
    // Update progress bar
    doneCount += isDone ? 1 : -1;
    const pct = Math.round((doneCount / totalLessons) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.querySelector('.nav-progress-label').textContent = `${pct}% done`;
  }
});

// ── Custom cursor
const cursor = document.getElementById('cursor');
const ring = document.getElementById('cursorRing');
let mx=0,my=0,rx=0,ry=0;
document.addEventListener('mousemove', e => { mx=e.clientX; my=e.clientY; });
(function animateCursor(){
  cursor.style.left=mx+'px'; cursor.style.top=my+'px';
  rx+=(mx-rx)*0.13; ry+=(my-ry)*0.13;
  ring.style.left=rx+'px'; ring.style.top=ry+'px';
  requestAnimationFrame(animateCursor);
})();
document.querySelectorAll('a, button, .lesson-header, .card-wrap').forEach(el=>{
  el.addEventListener('mouseenter',()=>{ ring.style.transform='translate(-50%,-50%) scale(1.6)'; });
  el.addEventListener('mouseleave',()=>{ ring.style.transform='translate(-50%,-50%) scale(1)'; });
});

document.querySelector('.sidebar-section-btn').click();
